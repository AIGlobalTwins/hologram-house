<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0908" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Hologram House</title>
    <script type="module" crossorigin src="./assets/index-C8fobaPf.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CxcvM9GN.css">
  </head>
  <body>
    <div class="stage">
      <header>
        <div class="brand">Hologram<span>House</span></div>
        <button id="gyro" class="ghost" aria-pressed="false">Movimento</button>
      </header>

      <div class="halo" aria-hidden="true"></div>

      <model-viewer
        id="mv"
        alt="Maquete 3D do apartamento"
        camera-controls
        touch-action="none"
        interaction-prompt="none"
        camera-orbit="42deg 62deg 105%"
        min-camera-orbit="auto 15deg auto"
        max-camera-orbit="auto 89deg auto"
        field-of-view="28deg"
        shadow-intensity="1.3"
        shadow-softness="0.9"
        exposure="1.05"
        tone-mapping="neutral"
        ar
        ar-modes="webxr quick-look"
        ar-scale="auto"
        ar-placement="floor"
      >
        <button slot="ar-button" id="ar" class="primary">Ver na minha mesa (AR)</button>
        <div slot="progress-bar"></div>
      </model-viewer>

      <div id="loader" class="loader">A construir o apartamento…</div>

      <footer id="panel">
        <div class="label">
          <button id="prev" class="arrow" aria-label="Estilo anterior">‹</button>
          <div class="pill">
            <strong id="name"></strong>
            <small id="tagline"></small>
          </div>
          <button id="next" class="arrow" aria-label="Estilo seguinte">›</button>
        </div>
        <div id="chips" class="chips" role="tablist"></div>
        <p id="hint" class="hint"></p>
      </footer>
    </div>
  </body>
</html>
