<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14110f" />
    <title>Hologram House</title>
    <script type="module" crossorigin src="./assets/index-gp8q9k-c.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bi-aw2tw.css">
  </head>
  <body>
    <canvas id="c"></canvas>

    <!-- Tudo o que está em #ui também aparece por cima da câmara durante o AR -->
    <div id="ui">
      <header>
        <div class="brand">Hologram<span>House</span></div>
        <button id="arBtn" class="primary" data-act="ar">Ver em AR</button>
      </header>

      <div id="arbar">
        <button data-act="ar-exit">Sair</button>
        <button data-act="ar-place">Reposicionar</button>
        <button data-act="ar-scale" id="scaleBtn">Tamanho real</button>
        <button data-act="ar-shell" id="shellBtn">Paredes</button>
      </div>

      <div id="toast" hidden></div>
      <div id="loader">A carregar o espaço…</div>

      <section id="sheet">
        <div id="hist">
          <button id="undoBtn" data-act="undo" aria-label="Anular" disabled>↶</button>
          <button id="redoBtn" data-act="redo" aria-label="Refazer" disabled>↷</button>
        </div>
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </section>
    </div>

    <input id="scanFile" type="file" accept=".glb,model/gltf-binary" hidden />
  </body>
</html>
